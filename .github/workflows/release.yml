name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    name: Quality gates
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup component add rustfmt clippy

      # Tag/version check runs first: a mismatch must fail before anything is built
      # or published. Skipped for manual workflow_dispatch runs off a branch.
      - name: Verify release tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          CRATE_VERSION=$(grep -m1 '^version =' Cargo.toml | cut -d '"' -f2)
          if [ "${{ github.ref_name }}" != "v${CRATE_VERSION}" ]; then
            echo "Ref '${{ github.ref_name }}' does not match crate version 'v${CRATE_VERSION}'"
            exit 1
          fi

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test

  build:
    name: Build (${{ matrix.target }})
    needs: checks
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset_name: pmux-macos-aarch64
          - target: x86_64-apple-darwin
            asset_name: pmux-macos-x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary asset
        run: cp "target/${{ matrix.target }}/release/pmux" "${{ matrix.asset_name }}"

      # Architecture gate: verify the binary was compiled for the target architecture
      # and not substituted or faked.
      - name: Verify binary architecture
        run: |
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              file "${{ matrix.asset_name }}" | grep -q "arm64" || { echo "Binary is not arm64"; exit 1; }
              ;;
            x86_64-apple-darwin)
              file "${{ matrix.asset_name }}" | grep -q "x86_64" || { echo "Binary is not x86_64"; exit 1; }
              ;;
          esac

      - name: Generate SHA-256 checksum
        run: shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  release:
    name: Publish Release
    needs: build
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: "See [CHANGELOG.md](https://github.com/NN224/ProfileMux/blob/${{ github.ref_name }}/CHANGELOG.md) for release notes."
          draft: false
          prerelease: false
          files: |
            pmux-macos-aarch64
            pmux-macos-aarch64.sha256
            pmux-macos-x86_64
            pmux-macos-x86_64.sha256
