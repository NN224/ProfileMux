[package]
name = "profilemux"
version = "1.2.0"
edition = "2021"
# Driven by existing dependencies (plist -> time, ratatui -> instability ->
# darling), not by the updater stack.
rust-version = "1.88"
description = "Cross-browser profile manager for power users"
license = "MIT"

[[bin]]
name = "pmux"
path = "src/main.rs"

[lib]
name = "profilemux"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
plist = "1"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
semver = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["tls", "json", "gzip"] }

[dev-dependencies]
tempfile = "3"
