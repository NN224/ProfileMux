[package]
name = "profilemux"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Cross-browser profile manager for power users"
license = "MIT"

[[bin]]
name = "pmux"
path = "src/main.rs"

[lib]
name = "profilemux"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
plist = "1"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
